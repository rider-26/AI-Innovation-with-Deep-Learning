[project]
name = "shopsphere"
version = "0.1.0"
description = "ShopSphere Win-Back Decision Agent: IT2226 AI Innovation and Deep Learning Project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Data and classical ML (baselines, preprocessing, metrics)
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    # Deep learning model
    "torch>=2.4",
    # Tuning, explanations, plots
    "optuna>=3.6",
    "shap>=0.46",
    "matplotlib>=3.9",
    "plotly>=5.22",
    # Shared config and validation
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Needed from PR2 onwards. Install with: uv sync --extra app
app = [
    "langgraph>=0.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopsphere"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
